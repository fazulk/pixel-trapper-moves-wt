<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="vanillaIceClip">
      <rect x="138" y="198" width="320" height="228" rx="24"/>
    </clipPath>
    <clipPath id="wuTangClip">
      <rect x="642" y="198" width="320" height="228" rx="24"/>
    </clipPath>
  </defs>
  <rect width="1100" height="620" rx="44" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#fff" stroke-width="4">
    <path d="M60 120 C220 20 380 220 540 120 S860 20 1040 140"/>
    <path d="M70 500 C240 380 400 580 570 470 S880 360 1030 500"/>
  </g>
  <text x="550" y="86" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">The wrapper</text>
  <text x="550" y="128" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#c7d2fe">(obvious joke goes here)</text>

  <g filter="url(#shadow)">
    <rect x="98" y="168" width="400" height="330" rx="34" fill="#f8fafc" opacity="0.96"/>
    <image href="/images/vanilla-ice.png" x="138" y="198" width="320" height="228" preserveAspectRatio="xMidYMin slice" clip-path="url(#vanillaIceClip)"/>
    <rect x="172" y="408" width="252" height="48" rx="24" fill="#2563eb"/>
    <text x="298" y="435" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#fff">Vanilla Ice</text>
  </g>

  <text x="550" y="356" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="900" fill="#fff">+</text>

  <g filter="url(#shadow)">
    <rect x="602" y="168" width="400" height="330" rx="34" fill="#fde68a" opacity="0.96"/>
    <image href="/images/wu-tang-clan.png" x="642" y="198" width="320" height="228" preserveAspectRatio="xMidYMid slice" clip-path="url(#wuTangClip)"/>
    <rect x="670" y="402" width="264" height="54" rx="27" fill="#111827"/>
    <text x="802" y="437" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#facc15">Wu-Tang Clan</text>
  </g>
</svg>
